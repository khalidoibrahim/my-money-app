name: Build My Money APK
on:
  push:
    branches: [main]
    paths-ignore: ['download/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: App icon, portrait, permissions, version
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png $R/mipmap-$d/ic_launcher.png
            cp icons/$d-round.png $R/mipmap-$d/ic_launcher_round.png
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' $M
          sed -i '/android.permission.INTERNET/d' $M
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Hand unsigned release APK to the builds branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds && git rm -rqf . && rm -rf node_modules android
          cp /tmp/out/app-release-unsigned.apk .
          git add app-release-unsigned.apk && git commit -qm "Unsigned release build ${{ github.run_number }}"
          git push -f origin builds

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK with apksigner
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          { echo "build-tools: $BT"
            $BT/apksigner verify --verbose --print-certs download/My-Money.apk; echo "apksigner exit: $?"
            $BT/zipalign -c -p 4 download/My-Money.apk; echo "zipalign exit: $?"
            $BT/aapt2 dump badging download/My-Money.apk | grep -E "package:|sdkVersion|targetSdk|permission|application-label:"; } > verify-log.txt 2>&1 || true
          cat verify-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp verify-log.txt /tmp/ && git checkout --orphan verify-log && git rm -rqf . && cp /tmp/verify-log.txt .
          git add verify-log.txt && git commit -qm "verify log" && git push -f origin verify-log

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old releases with the signed APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for t in $(gh release list --json tagName --jq '.[].tagName'); do gh release delete "$t" --yes --cleanup-tag; done
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" download/My-Money.apk --title "My Money $V" --latest --notes "Signed release build. Download **My-Money.apk** below and open it on an Android phone (Android 7 or newer). The app asks for no permissions and works fully offline."
