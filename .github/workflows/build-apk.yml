name: Build My Money APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: App icon, portrait, colours
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png $R/mipmap-$d/ic_launcher.png
            cp icons/$d-round.png $R/mipmap-$d/ic_launcher_round.png
          done
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Money.apk
      - uses: actions/upload-artifact@v4
        with: { name: My-Money-apk, path: My-Money.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v1.0.${{ github.run_number }}" My-Money.apk --title "My Money ${{ github.run_number }}" --notes "Install My-Money.apk on Android"
