name: Build and publish Pocket Ledger APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Bundle fonts for offline use
        run: node scripts/bundle-fonts.mjs
        continue-on-error: true
      - run: npx cap add android
      - name: App icon, portrait, no permissions, version
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png $R/mipmap-$d/ic_launcher.png
            cp icons/$d-round.png $R/mipmap-$d/ic_launcher_round.png
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' $M
          sed -i '/android.permission.INTERNET/d' $M
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          grep -E 'minSdkVersion|compileSdkVersion|targetSdkVersion' android/variables.gradle
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign with apksigner and verify
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks; PASS="$KEYSTORE_PASS"
          else
            echo "No KEYSTORE_B64 secret set: signing with a fresh key for this build."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -alias release -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Khalid Ibrahim, O=Pocket Ledger, C=BD"
          fi
          $BT/apksigner sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias release --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --out PocketLedger.apk aligned.apk
          rm -f release.jks
          $BT/apksigner verify --verbose --print-certs PocketLedger.apk
          $BT/aapt2 dump badging PocketLedger.apk | grep -E "package:|sdkVersion|targetSdk|uses-permission|application-label:" || true
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v$V-build${{ github.run_number }}"; fi
          gh release create "$TAG" PocketLedger.apk --title "Pocket Ledger $V" --latest --notes "Signed release build. Download **PocketLedger.apk** below and open it on an Android phone (Android 7 or newer). Works fully offline and asks for no permissions. Your data stays on your phone."
